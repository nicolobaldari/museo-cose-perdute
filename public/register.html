<!--
Questo file gestisce la pagina di registrazione per i nuovi utenti.
Raccoglie nome, email e password tramite un form e invia i dati al server per creare l'account,
reindirizzando poi l'utente alla pagina di login in caso di successo.
-->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museo delle Cose Perdute - Registrazione</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans text-gray-800">

<header class="bg-white px-[5%] py-4 flex justify-between items-center shadow-sm sticky top-0 z-50 w-full">
    <a href="/" class="text-xl font-black text-slate-800 tracking-tight">Il Museo delle Cose Perdute</a>
    <nav class="flex items-center">
        <a href="/" class="text-sm font-semibold text-gray-500 hover:text-blue-600 transition-colors">Home</a>
    </nav>
</header>

<main class="flex-1 flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm border border-gray-100">
        <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">Crea un Account</h2>
        <!-- Modulo di registrazione: raccoglie i dati del nuovo utente (nome, email e password) -->
        <form id="registerForm" class="space-y-4">
            <div>
                <label for="nome" class="block text-sm font-semibold text-gray-700 mb-1">Nome Completo:</label>
                <input type="text" id="nome" placeholder="Es. Mario Rossi" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all">
            </div>
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email:</label>
                <input type="email" id="email" placeholder="Es. mario@rossi.com" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all">
            </div>
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password:</label>
                <input type="password" id="password" placeholder="Minimo 6 caratteri" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all">
            </div>
            <button type="submit"
                    class="w-full mt-2 bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg shadow hover:shadow-md transition-all duration-200">
                Registrati
            </button>
        </form>

        <div class="mt-5 text-center text-sm text-gray-600">
            Hai già un account? <a href="/login.html" class="text-blue-600 hover:underline font-semibold">Accedi qui</a>
        </div>
        <!-- Contenitore dedicato ai messaggi di feedback (es. "Registrazione completata!" o errori) -->
        <div id="messaggio" class="mt-4 text-center font-bold text-sm"></div>
    </div>
</main>

<footer class="bg-slate-800 text-slate-400 text-center py-4 text-sm w-full mt-auto">
    &copy; 2026 Il Museo delle Cose Perdute. Se hai perso la <span class="text-red-500 font-bold">dignità</span>, purtroppo quella non te la possiamo restituire.
</footer>

<script>
    // Intercetta l'invio del form, trasmette i dati all'API di registrazione e gestisce il redirect o gli errori
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nome = document.getElementById('nome').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const messaggioDiv = document.getElementById('messaggio');

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, password })
            });
            const data = await response.json();

            if (response.ok) {
                messaggioDiv.className = "mt-4 text-center font-bold text-sm text-green-600";
                messaggioDiv.innerText = "Registrazione completata! Ti stiamo reindirizzando...";
                setTimeout(() => { window.location.href = '/login.html'; }, 2000);
            } else {
                messaggioDiv.className = "mt-4 text-center font-bold text-sm text-red-600";
                messaggioDiv.innerText = data.errore || "Errore durante la registrazione";
            }
        } catch (error) {
            messaggioDiv.className = "mt-4 text-center font-bold text-sm text-red-600";
            messaggioDiv.innerText = "Errore di connessione al server";
        }
    });
</script>
</body>
</html>
